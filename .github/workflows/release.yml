name: Publish APK

# Personal fork: builds the debug APK and publishes it as a GitHub release, so the TV can
# download it with a fixed address (releases/latest/download/BadrTV.apk).
# Note: debug builds are signed with a key created on the build machine. A newer APK therefore
# does not install over an older one; uninstall the old app first (settings are lost).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-apk
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -n 1)" BadrTV.apk
          gh release delete perso-latest --cleanup-tag --yes || true
          gh release create perso-latest BadrTV.apk \
            --target "$GITHUB_SHA" \
            --title "Badr TV (build ${GITHUB_RUN_NUMBER})" \
            --notes "Personal build of this fork. Install on Fire TV with the Downloader app." \
            --latest
